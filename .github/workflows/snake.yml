name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 de Brasília
  workflow_dispatch:     # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (black and white)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#3d3d3d,#707070,#a8a8a8,#ffffff
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebedf0,#c2c2c2,#8f8f8f,#575757,#000000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
