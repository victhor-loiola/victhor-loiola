<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Victhor Loiola, Software Engineer">
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Janela de terminal -->
  <rect x="1" y="1" width="1198" height="218" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="25" width="1198" height="10" fill="#161b22"/>
  <line x1="1" y1="35" x2="1199" y2="35" stroke="#30363d" stroke-width="2"/>
  <circle cx="26" cy="18" r="6" fill="#484f58"/>
  <circle cx="46" cy="18" r="6" fill="#484f58"/>
  <circle cx="66" cy="18" r="6" fill="#484f58"/>
  <text x="600" y="23" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">victhor@debian: ~</text>

  <!-- Conteúdo -->
  <text x="40" y="80" class="mono" font-size="18" fill="#8b949e">victhor@debian:~$ <tspan fill="#ffffff">whoami</tspan></text>
  <text x="40" y="132" class="mono" font-size="44" font-weight="700" fill="#ffffff">Victhor Loiola</text>
  <text x="40" y="170" class="mono" font-size="18" fill="#c9d1d9">Software Engineer | Python &amp; Java | Back-End, Artificial Intelligence &amp; Machine Learning</text>
  <text x="40" y="202" class="mono" font-size="18" fill="#8b949e">victhor@debian:~$ <tspan class="cursor" fill="#ffffff">█</tspan></text>
</svg>
