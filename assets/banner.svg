<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Victhor Loiola — Back-End Developer, Java and Spring Boot">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="400" rx="18"/>
    </clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363D"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0D1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E53935" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#E53935" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E53935" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E53935" stop-opacity="1"/>
      <stop offset="1" stop-color="#E53935" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="400" fill="#0D1117"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <ellipse cx="920" cy="210" rx="430" ry="300" fill="url(#glow)"/>
    <rect width="760" height="400" fill="url(#fade)"/>
    <rect y="396" width="1200" height="4" fill="url(#edge)"/>

    <!-- left: identity -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <rect x="70" y="104" width="28" height="3" fill="#E53935"/>
      <text x="110" y="111" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#E53935">SOFTWARE ENGINEERING · PUC MINAS</text>

      <text x="66" y="182" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Victhor Loiola<tspan fill="#E53935">.</tspan></text>

      <text x="70" y="226" font-size="25" font-weight="500" fill="#C9D1D9">Back-End Developer · Java &amp; Spring Boot</text>

      <!-- tech chips -->
      <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">
        <rect x="70" y="252" width="80" height="30" rx="15" fill="#E53935"/>
        <text x="110" y="272" fill="#FFFFFF">Java 21</text>

        <rect x="160" y="252" width="112" height="30" rx="15" fill="#161B22" stroke="#E53935" stroke-opacity="0.55"/>
        <text x="216" y="272" fill="#E6EDF3">Spring Boot</text>

        <rect x="282" y="252" width="104" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
        <text x="334" y="272" fill="#E6EDF3">PostgreSQL</text>

        <rect x="396" y="252" width="88" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
        <text x="440" y="272" fill="#E6EDF3">RabbitMQ</text>

        <rect x="494" y="252" width="74" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
        <text x="531" y="272" fill="#E6EDF3">Docker</text>
      </g>

      <text x="70" y="328" font-size="17" fill="#8B949E">REST APIs · Microservices · Event-driven systems</text>
    </g>

    <!-- right: code window -->
    <g transform="translate(700 56)">
      <rect width="440" height="292" rx="12" fill="#161B22" stroke="#30363D"/>
      <path d="M12 0h416a12 12 0 0 1 12 12v24H0V12A12 12 0 0 1 12 0z" fill="#1C2129"/>
      <line x1="0" y1="36" x2="440" y2="36" stroke="#30363D"/>
      <circle cx="22" cy="18" r="6" fill="#E53935"/>
      <circle cx="42" cy="18" r="6" fill="#30363D"/>
      <circle cx="62" cy="18" r="6" fill="#30363D"/>
      <text x="220" y="23" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8B949E">Developer.java</text>

      <g font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
        <g fill="#484F58" text-anchor="end">
          <text x="30" y="68">1</text><text x="30" y="90">2</text><text x="30" y="112">3</text>
          <text x="30" y="134">4</text><text x="30" y="156">5</text><text x="30" y="178">6</text>
          <text x="30" y="200">7</text><text x="30" y="222">8</text><text x="30" y="244">9</text>
          <text x="30" y="266">10</text>
        </g>
        <g fill="#E6EDF3" xml:space="preserve">
          <text x="46" y="68"><tspan fill="#E53935">@RestController</tspan></text>
          <text x="46" y="90"><tspan fill="#E53935">@RequestMapping</tspan><tspan fill="#8B949E">(</tspan><tspan fill="#FFB3AE">"/api/victhor"</tspan><tspan fill="#8B949E">)</tspan></text>
          <text x="46" y="112"><tspan fill="#FF7B72">public class</tspan> Developer <tspan fill="#8B949E">{</tspan></text>
          <text x="46" y="156">    <tspan fill="#E53935">@GetMapping</tspan><tspan fill="#8B949E">(</tspan><tspan fill="#FFB3AE">"/stack"</tspan><tspan fill="#8B949E">)</tspan></text>
          <text x="46" y="178">    <tspan fill="#FF7B72">public</tspan> List<tspan fill="#8B949E">&lt;</tspan>String<tspan fill="#8B949E">&gt;</tspan> stack<tspan fill="#8B949E">() {</tspan></text>
          <text x="46" y="200">        <tspan fill="#FF7B72">return</tspan> List.of<tspan fill="#8B949E">(</tspan><tspan fill="#FFB3AE">"Java"</tspan><tspan fill="#8B949E">,</tspan> <tspan fill="#FFB3AE">"Spring"</tspan><tspan fill="#8B949E">,</tspan></text>
          <text x="46" y="222">            <tspan fill="#FFB3AE">"PostgreSQL"</tspan><tspan fill="#8B949E">,</tspan> <tspan fill="#FFB3AE">"RabbitMQ"</tspan><tspan fill="#8B949E">);</tspan></text>
          <text x="46" y="244">    <tspan fill="#8B949E">}</tspan></text>
          <text x="46" y="266"><tspan fill="#8B949E">}</tspan></text>
        </g>
        <rect x="58" y="253" width="9" height="17" fill="#E53935">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#21262D"/>
</svg>

